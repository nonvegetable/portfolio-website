<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/assets/viggi-high-resolution-logo-grayscale-transparent.svg">
  <link rel="alternate icon" type="image/png" href="favicon-32.png">
  <title>Vighnesh Palande | Data Engineer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas class="pixel-canvas" aria-hidden="true"></canvas>
  <section class="hero-section">
    <div class="hero-left">
      <div class="hero-details">
        <div class="name" data-name></div>
        <div class="year" data-year></div>
      </div>
    </div>
    <div class="hero-right">
      <div class="logo-container">
        <img src="assets/viggi-high-resolution-logo-grayscale-transparent.svg" alt="Viggi logo" class="logo">
      </div>
    </div>
  </section>

  <div class="container">
    <main class="main-content" id="portfolio-content" aria-live="polite"></main>

    <footer class="footer">
      <div data-footer-message></div>
      <div class="footer-availability" data-footer-availability></div>
      <div class="social-links" data-footer-links></div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
